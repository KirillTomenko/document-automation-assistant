[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "document-automation-assistant"
version = "0.1.0"
description = "Local document workflow with source validation and two DOCX outputs"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "pypdf==6.17.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "httpx==0.27.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "streamlit==1.51.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "jsonschema==4.25.1", "ruff==0.16.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_automation = ["assets/*.docx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
